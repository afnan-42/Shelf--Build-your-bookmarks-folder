name: Report a broken or wrong link
description: A site moved, shut down or is listed in the wrong place
title: "Broken: "
labels: [catalog, bug]
body:
  - type: input
    id: site
    attributes:
      label: Site name and address
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      placeholder: Redirects elsewhere, shut down, wrong category, wrong region...
    validations:
      required: true
